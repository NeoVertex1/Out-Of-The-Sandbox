name: Verify game
on: [push, pull_request]
permissions:
  contents: read
jobs:
  game:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: bash -n scripts/*.sh Play.command
      - if: matrix.os == 'macos-14'
        run: ./scripts/package-release.sh
  sandbox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install signed gVisor package
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main' | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl reload docker
      - run: docker build -t oots-worker:local sandbox
      - run: bash scripts/smoke-sandbox.sh
