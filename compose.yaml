name: out-of-the-sandbox
services:
  web:
    build: { context: ., target: web }
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports: ["127.0.0.1:4100:4100"]
    environment:
      NODE_ENV: production
      DATA_DIR: /var/lib/oots
      SANDBOX_RUNTIME: runsc
      WORKER_IMAGE: oots-worker:local
      BRIDGE_URL: http://codex-bridge:4101
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?Run scripts/install.sh first}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    volumes:
      - ./.data/server:/var/lib/oots
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs: [/tmp:size=64m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [codex-bridge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  codex-bridge:
    build: { context: ., target: codex-bridge }
    runtime: runsc
    restart: unless-stopped
    init: true
    environment:
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?Run scripts/install.sh first}
    volumes: [codex-auth:/var/lib/oots-codex]
    read_only: true
    tmpfs: [/tmp:size=128m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
volumes:
  codex-auth:
